# This file is re-created when Nginx starts.
# Consider using UCI or creating files in /etc/nginx/conf.d/ for configuration.
# Parsing UCI configuration is skipped if uci set nginx.global.uci_enable=false
# For details see: https://openwrt.org/docs/guide-user/services/webserver/nginx
# UCI_CONF_VERSION=1.2

worker_processes auto;

user root;

include module.d/*.module;

events {}

http {
	access_log off;
	log_format openwrt
		'$request_method $scheme://$host$request_uri => $status'
		' (${body_bytes_sent}B in ${request_time}s) <- $http_referer';

	include mime.types;
	default_type application/octet-stream;
	sendfile on;

	client_max_body_size 128M;
	large_client_header_buffers 2 1k;

	gzip on;
	gzip_vary on;
	gzip_proxied any;

	root /www;

##	upstream backend {
##		ip_hash;
##		server 192.168.16.2:8080;
##		server 192.168.16.4:8080;
##	}

	map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
	}

	server { #see uci show 'nginx.CTKwrt'
		listen 443 ssl;
		listen [::]:443 ssl;
		server_name ctkwrtap.com;
		include conf.d/wrt.locations;
		include restrict_locally;
		ssl_certificate /etc/nginx/conf.d/ctkwrt.crt;
		ssl_certificate_key /etc/nginx/conf.d/ctkwrt.key;
		ssl_session_cache shared:SSL:32k;
		ssl_session_timeout 64m;
		ssl_protocols TLSv1.2 TLSv1.3;
		access_log syslog openwrt;
		error_log syslog;
	}

